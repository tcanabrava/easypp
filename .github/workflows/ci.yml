name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Arch Linux: current clang, Qt 6, GTK 4 and Boost, with the same package
    # names easypp was developed against.
    container: archlinux:latest
    steps:
      - name: Install toolchain and example dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git rust clang gcc lld lldb openmp pkgconf cmake ninja cuda \
            zlib sdl2-compat gtk4 boost qt6-base qt6-declarative gtest catch2 \
            libkdegames kcrash kdbusaddons kiconthemes vte4 fmt pcre2 python-pipx \
            aarch64-linux-gnu-gcc qemu-user
          /opt/cuda/bin/nvcc --version
          echo /opt/cuda/bin >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Formatting
        run: cargo fmt --check

      - name: Lints
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Unit, integration, and clean example builds
        run: cargo test --release -- --include-ignored
