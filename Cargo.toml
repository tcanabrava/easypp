[package]
name = "easypp"
version = "0.1.0"
edition = "2024"
description = "A zero-configuration build tool for small C and C++ projects"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
quick-xml = "0.42"
serde_json = "1"
turso = { version = "0.8.3", default-features = false }

[profile.release]
strip = true
